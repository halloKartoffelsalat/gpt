<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <title>TITEL – Bergstraße Eins</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header wird geladen -->
<div id="header"></div>

<div class="page-banner">

  <picture>
    <source
      media="(max-width: 767px)"
      srcset="pictures/weiss_mobile.jpg">

    <img
      src="pictures/weiss_banners.jpg"
      alt="Bannerbild Das Haus">
  </picture>

  <div class="banner-overlay">

    <div class="banner-kreis-container">

      <img
        class="banner-kreis"
        src="pictures/circle500.png"
        alt="">

      <h1 class="banner-title">Aktuelles</h1>

    </div>
  </div>
</div>

<main class="container">

  <h1>Was gibt's Neues?</h1>

  <p>
    Hier informieren wir über alles, worüber es sich zu sprechen lohnt
  </p>

  <div id="news-list"></div>

</main>

<!-- Footer wird geladen -->
<div id="footer"></div>


<!-- News aus Airtable laden -->
<script>
async function loadNews() {
  const newsList = document.getElementById("news-list");

  try {
    const response = await fetch(
      "https://bergstrasse-news-api.sebastian-habermann.workers.dev"
    );

    if (!response.ok) {
      throw new Error(`HTTP-Fehler: ${response.status}`);
    }

    const news = await response.json();

    newsList.innerHTML = "";

    if (news.length === 0) {
      newsList.innerHTML =
        "<p>Zurzeit gibt es keine Neuigkeiten.</p>";
      return;
    }

    news.forEach(article => {

  const articleElement = document.createElement("article");
  articleElement.className = "news-entry";

  const date = document.createElement("p");
  date.textContent =
    new Date(article.datum).toLocaleDateString("de-DE");
  date.className = "news-date";

  const title = document.createElement("h2");
  title.textContent = article.titel;

  const text = document.createElement("p");
  text.textContent = article.text;
  text.className = "news-text";

  articleElement.appendChild(date);
  articleElement.appendChild(title);

if (article.bild && article.bild.length > 0) {
  const image = document.createElement("img");

  image.src = article.bild[0].url;
  image.alt = article.titel;
  image.className = "news-image";

  articleElement.appendChild(image);
}

articleElement.appendChild(text);

newsList.appendChild(articleElement);
});
    
  } catch (error) {

    console.error("Fehler beim Laden der News:", error);

    newsList.innerHTML =
      "<p>Die Neuigkeiten konnten momentan nicht geladen werden.</p>";
  }
}

loadNews();
</script>


<!-- Header und Footer laden -->
<script>
function loadHTML(id, file) {
  fetch(file)
    .then(response => response.text())
    .then(data => {

      document.getElementById(id).innerHTML = data;

      if (id === "header") {

        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav');

        if (burger && nav) {

          burger.addEventListener('click', () => {
            nav.classList.toggle('open');
          });

        }
      }
    });
}

loadHTML("header", "header.html");
loadHTML("footer", "footer.html");
</script>

</body>
</html>
