<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <title>TITEL – Bergstraße Eins</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header wird geladen -->
<div id="header"></div>

<div class="page-banner">

  <picture>
    <source
      media="(max-width: 767px)"
      srcset="pictures/weiss_mobile.jpg">

    <img
      src="pictures/weiss_banners.jpg"
      alt="Bannerbild Das Haus">
  </picture>

 <div class="banner-overlay">

  <div class="banner-kreis-container">

    <img
      class="banner-kreis"
      src="pictures/circle500.png"
      alt="">

    <h1 class="banner-title">Aktuelles</h1>

    </div>
  </div>
</div>
  
<main class="container">

  <h1>Was gibt's Neues?</h1>



<p>
  Hier informieren wir über alles, worüber es sich zu sprechen lohnt
</p>



</main>

<!-- Footer wird geladen -->
<div id="footer"></div>

<script>
function loadHTML(id, file) {
  fetch(file)
    .then(response => response.text())
    .then(data => {
      document.getElementById(id).innerHTML = data;

      if (id === "header") {
        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav');

        if (burger && nav) {
          burger.addEventListener('click', () => {
            nav.classList.toggle('open');
          });
        }
      }
    });
}

loadHTML("header", "header.html");
loadHTML("footer", "footer.html");
</script>

</body>
</html>
