<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <title>Downloads – Bergstraße Eins</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="header"></div>

<div class="page-banner">
  <picture>
    <source 
      media="(max-width: 767px)"
      srcset="mauer_mobile.jpg">

    <img 
      src="mauer_banners.jpg"
      alt="Bannerbild Das Haus">
  </picture>
</div>
  
<main class="container">

  <section class="intro">
  <h1>Erweiterte Dokumente</h1>

  <div class="download-card">
  <h2>📄 Finanzplanung</h2>
  <p>
    Vorstellung der Finanzplanung
  </p>
  <a href="downloads/finanzen.pdf" class="btn">PDF herunterladen</a>
</div>

<div class="download-card">
  <h2>📄 Geschäftsordnung</h2>
  <p>
    Geschäftsordnung des Projekts
  </p>
  <a href="downloads/geschäftsordnung.pdf" class="btn">PDF herunterladen</a>
</div>

<div class="download-card">
  <h2>📄 Projekt-AGs</h2>
  <p>
    Übersicht über die unterschiedlichen Arbeitsgemeinschaften im Projekt und ihre Mitglieder
  </p>
  <a href="downloads/Arbeitsgemeinschaften.pdf" class="btn">PDF herunterladen</a>
</div>

  
</section>
</main>

<script>

    
const burger = document.getElementById('burger');
const nav = document.getElementById('nav');

burger.addEventListener('click', () => {
  nav.classList.toggle('open');
});
</script>
 <div id="footer"></div>

 <script>
function loadHTML(id, file) {
  fetch(file)
    .then(response => response.text())
    .then(data => {
      document.getElementById(id).innerHTML = data;

      // Burger-Menü erst nach Laden aktivieren
      if (id === "header") {
        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav');

        if (burger && nav) {
          burger.addEventListener('click', () => {
            nav.classList.toggle('open');
          });
        }
      }
    });
}

// Header & Footer laden
loadHTML("header", "header.html");
loadHTML("footer", "footer.html");
</script>

  
</body>
</html>
